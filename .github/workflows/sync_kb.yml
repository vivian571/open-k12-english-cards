name: Sync Cards from Knowledge Base

on:
  schedule:
    - cron: '0 2 * * *' # Every day at 02:00 UTC
  workflow_dispatch:
  repository_dispatch:
    types: [kb_updated]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Cards Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Dynamic Sync from Knowledge Base
        run: |
          python3 scripts/sync_from_kb.py
          python3 -c "
          import json
          with open('data/cards.json') as f:
              cards = json.load(f)
          print(f'Successfully validated {len(cards)} cards.')
          "

      - name: Commit and Push Changes if Updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ exports/
          if git diff --staged --quiet; then
            echo "No changes detected in cards."
          else
            git commit -m "chore(sync): auto-sync painless cards with open-k12-english-kb"
            git push
          fi
