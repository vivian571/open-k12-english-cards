<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>初中英语无痛闯关卡 (Painless English Challenge Cards)</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --card-border: #1e293b;
      --card-hover: #1c2742;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.25);
      --success: #10b981;
      --success-glow: rgba(16, 185, 129, 0.2);
      --danger: #ef4444;
      --danger-glow: rgba(239, 68, 68, 0.2);
      --warning: #f59e0b;
      --warning-bg: rgba(245, 158, 11, 0.12);
      --purple: #8b5cf6;
      --gold: #fbbf24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
      padding: 1.5rem;
      min-height: 100vh;
    }
    .container { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem; }

    /* Header */
    header {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 1.25rem;
      padding: 1.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
      position: relative;
      overflow: hidden;
    }
    header::after {
      content: "";
      position: absolute;
      top: 0; right: 0; width: 300px; height: 100%;
      background: radial-gradient(circle at top right, rgba(59,130,246,0.15), transparent 70%);
      pointer-events: none;
    }
    .badge-row { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; }
    .badge {
      font-size: 0.75rem;
      padding: 0.3rem 0.75rem;
      border-radius: 9999px;
      font-weight: 600;
      border: 1px solid var(--card-border);
    }
    .badge-blue { background: rgba(59,130,246,0.15); border-color: rgba(59,130,246,0.4); color: #60a5fa; }
    .badge-green { background: rgba(16,185,129,0.15); border-color: rgba(16,185,129,0.4); color: #34d399; }
    .badge-purple { background: rgba(139,92,246,0.15); border-color: rgba(139,92,246,0.4); color: #a78bfa; }
    .badge-gold { background: rgba(251,191,36,0.15); border-color: rgba(251,191,36,0.4); color: #fbbf24; }

    h1 { font-size: 2rem; font-weight: 800; color: #fff; letter-spacing: -0.02em; }
    .subtitle { color: var(--muted); font-size: 0.95rem; max-width: 800px; }

    .header-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 0.5rem;
    }
    .action-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--card-border);
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 500;
      padding: 0.45rem 0.95rem;
      border-radius: 0.5rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      text-decoration: none;
      transition: all 0.2s;
    }
    .action-btn:hover {
      border-color: var(--accent);
      background: var(--accent-glow);
      color: #fff;
    }

    /* Control Panel */
    .controls {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 1rem;
      padding: 1.1rem 1.5rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }
    .search-input {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 0.6rem;
      padding: 0.6rem 1rem;
      color: var(--text);
      font-size: 0.9rem;
      min-width: 280px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-input:focus { border-color: var(--accent); }

    .view-mode-toggle {
      display: flex;
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 0.6rem;
      padding: 0.25rem;
      gap: 0.25rem;
    }
    .toggle-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 500;
      padding: 0.45rem 0.85rem;
      border-radius: 0.4rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .toggle-btn.active {
      background: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    /* Category Pill Bar */
    .pills-bar {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.35rem;
    }
    .pill-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--muted);
      font-size: 0.82rem;
      padding: 0.4rem 0.85rem;
      border-radius: 9999px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .pill-btn:hover { color: var(--text); border-color: var(--accent); }
    .pill-btn.active {
      background: rgba(59,130,246,0.18);
      border-color: var(--accent);
      color: #60a5fa;
      font-weight: 600;
    }

    /* Stats bar */
    .stats-banner {
      background: rgba(16,185,129,0.08);
      border: 1px solid rgba(16,185,129,0.25);
      border-radius: 0.75rem;
      padding: 0.75rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
    }

    /* Cards Grid */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 1.25rem;
    }

    /* 3D Flip Card Container */
    .card-scene {
      perspective: 1200px;
      min-height: 420px;
    }
    .flip-card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 1rem;
    }
    .flip-card.is-flipped {
      transform: rotateY(180deg);
    }

    /* Front & Back Faces */
    .card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 1rem;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 1.4rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .card-face-back {
      transform: rotateY(180deg);
      background: #151e33;
      border-color: rgba(59,130,246,0.4);
    }

    .card-badge-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-category {
      font-size: 0.75rem;
      font-weight: 600;
      color: #60a5fa;
      background: rgba(59,130,246,0.12);
      padding: 0.2rem 0.6rem;
      border-radius: 0.35rem;
      border: 1px solid rgba(59,130,246,0.25);
    }
    .card-source { font-size: 0.72rem; color: var(--muted); }

    .card-title {
      font-size: 1.12rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.4;
    }

    /* Stage 1: Metaphor Box */
    .stage-box {
      background: var(--bg);
      border-radius: 0.65rem;
      padding: 0.95rem;
      border: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .stage-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .label-metaphor { color: #34d399; }
    .label-radar { color: #f59e0b; }
    .label-challenge { color: #a78bfa; }

    .stage-content {
      font-size: 0.88rem;
      color: #e2e8f0;
      line-height: 1.6;
    }

    .card-flip-btn {
      margin-top: auto;
      background: rgba(59,130,246,0.12);
      border: 1px solid rgba(59,130,246,0.3);
      color: #60a5fa;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 0.55rem;
      border-radius: 0.5rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s;
    }
    .card-flip-btn:hover {
      background: var(--accent);
      color: #fff;
    }

    /* Back Face Specifics */
    .formula-text {
      font-size: 0.85rem;
      color: #93c5fd;
      background: rgba(59,130,246,0.1);
      padding: 0.5rem 0.75rem;
      border-radius: 0.4rem;
      border-left: 3px solid var(--accent);
    }
    .pitfall-text {
      font-size: 0.82rem;
      color: #fca5a5;
      background: rgba(239,68,68,0.12);
      padding: 0.5rem 0.75rem;
      border-radius: 0.4rem;
      border-left: 3px solid var(--danger);
    }
    .citation-quote {
      font-size: 0.82rem;
      color: #cbd5e1;
      font-style: italic;
      border-top: 1px dashed var(--card-border);
      padding-top: 0.4rem;
    }

    /* Challenge Mode Views */
    .challenge-view {
      display: none;
      flex-direction: column;
      gap: 1.25rem;
    }
    .challenge-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 1rem;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.5rem;
    }
    .quiz-opt-btn {
      background: var(--bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      border-radius: 0.5rem;
      padding: 0.75rem 1rem;
      text-align: left;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.15s;
    }
    .quiz-opt-btn:hover:not(:disabled) {
      border-color: var(--accent);
      background: var(--card-hover);
    }
    .quiz-opt-btn.correct {
      border-color: var(--success) !important;
      background: var(--success-glow) !important;
      color: #34d399 !important;
      font-weight: 600;
    }
    .quiz-opt-btn.wrong {
      border-color: var(--danger) !important;
      background: var(--danger-glow) !important;
      color: #f87171 !important;
    }
    .hint-trigger {
      color: var(--warning);
      font-size: 0.82rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      width: fit-content;
    }
    .hint-box {
      display: none;
      background: var(--warning-bg);
      border: 1px solid rgba(245,158,11,0.3);
      color: #fde68a;
      border-radius: 0.5rem;
      padding: 0.75rem 1rem;
      font-size: 0.85rem;
    }
    .expl-box {
      display: none;
      background: rgba(59,130,246,0.1);
      border: 1px solid rgba(59,130,246,0.3);
      color: #93c5fd;
      border-radius: 0.5rem;
      padding: 0.85rem 1rem;
      font-size: 0.85rem;
      line-height: 1.6;
    }

    /* Modal for Anki/Markdown Export */
    .export-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(4px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }
    .export-modal.show { display: flex; }
    .export-content {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 1rem;
      max-width: 640px;
      width: 100%;
      padding: 1.75rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .code-block {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 0.5rem;
      padding: 1rem;
      font-family: monospace;
      font-size: 0.85rem;
      color: #a78bfa;
      overflow-x: auto;
      max-height: 200px;
    }
  </style>
</head>
<body>
  <div class="container">
    
    <!-- Header -->
    <header>
      <div class="badge-row">
        <span class="badge badge-blue">独立开源项目</span>
        <span class="badge badge-green" id="total-badge">76 张无痛闯关卡</span>
        <span class="badge badge-purple">动态联动 open-k12-english-kb</span>
        <span class="badge badge-gold">Anki / Markdown 导出就绪</span>
      </div>
      <h1>初中英语无痛闯关卡 (Painless English Cards)</h1>
      <p class="subtitle">
        告别死记硬背 · 每张卡片由三大无痛关卡筑基：<strong>关卡 1 心智生活隐喻</strong> ➔ <strong>关卡 2 避坑雷达与口诀</strong> ➔ <strong>关卡 3 登顶自测挑战</strong>。
      </p>
      
      <div class="header-actions">
        <button class="action-btn" onclick="openExportModal('anki')">
          <span>📦 导出 Anki 牌组 (.tsv)</span>
        </button>
        <button class="action-btn" onclick="openExportModal('markdown')">
          <span>📄 导出速记手册 (.md)</span>
        </button>
        <a href="https://github.com/vivian571/open-k12-english-cards" target="_blank" class="action-btn">
          <span>🐙 GitHub 独立仓库</span>
        </a>
        <a href="https://vivian571.github.io/open-k12-english-kb/" target="_blank" class="action-btn" style="border-color: rgba(16,185,129,0.4); color:#34d399;">
          <span>🌐 跳转父级知识库网站 ➔</span>
        </a>
      </div>
    </header>

    <!-- Controls Bar -->
    <div class="controls">
      <input type="text" id="card-search" class="search-input" placeholder="搜索卡片：如 宾从、完成时、介词、李明、Emma..." oninput="filterCards()">
      
      <div class="view-mode-toggle">
        <button id="btn-mode-flip" class="toggle-btn active" onclick="switchMode('flip')">🔄 3D 翻转卡片模式</button>
        <button id="btn-mode-challenge" class="toggle-btn" onclick="switchMode('challenge')">🏆 登顶闯关模式</button>
      </div>
    </div>

    <!-- Category Pills -->
    <div class="pills-bar" id="category-pills"></div>

    <!-- Stats Banner -->
    <div class="stats-banner">
      <div>
        当前展示卡片：<strong id="showing-count" style="color:#60a5fa;">76</strong> 张 · 
        闯关已答：<strong id="answered-count" style="color:#34d399;">0</strong> 题 · 
        正确率：<strong id="accuracy-rate" style="color:#fbbf24;">100%</strong>
      </div>
      <div style="font-size:0.8rem; color:var(--muted);">
        🔄 点击卡片翻转查看避坑雷达
      </div>
    </div>

    <!-- VIEW 1: 3D Flip Card Mode -->
    <div id="view-flip" class="cards-grid"></div>

    <!-- VIEW 2: Challenge Mode -->
    <div id="view-challenge" class="challenge-view"></div>

  </div>

  <!-- Export Dialog Modal -->
  <div id="export-modal" class="export-modal" onclick="closeExportModal(event)">
    <div class="export-content">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3 id="export-title" style="color:#fff; font-size:1.15rem;">导出文件指引</h3>
        <button onclick="document.getElementById('export-modal').classList.remove('show')" style="background:none; border:none; color:var(--muted); font-size:1.2rem; cursor:pointer;">✕</button>
      </div>
      <p id="export-desc" style="font-size:0.88rem; color:var(--muted);">复制下列内容或直接在仓库 exports/ 目录下载对应文件：</p>
      <div class="code-block" id="export-snippet"></div>
      <div style="display:flex; justify-content:flex-end; gap:0.75rem;">
        <button class="action-btn" onclick="navigator.clipboard.writeText(document.getElementById('export-snippet').innerText); alert('已复制到剪贴板！');">📋 复制内容</button>
        <a id="export-repo-link" href="https://github.com/vivian571/open-k12-english-cards/tree/main/exports" target="_blank" class="action-btn" style="background:var(--accent); color:#fff; border-color:var(--accent);">前往 GitHub 下载</a>
      </div>
    </div>
  </div>

  <script>
    const allCards = [{"card_id": "card_chap_01_p01", "topic_id": "chap_01_p01", "type": "grammar_checkpoint", "title": "可数名词及其单复数变化规则与不规则变化", "category": "第1章 名词 (Noun)", "page_ref": "手绘语法教材 P1-P3 · 对应外研七上 Starter & Unit 1", "level": "中考必考 · 无痛通关", "stage_1_metaphor": {"name": "关卡 1 · 心智隐喻破壁", "content": "名词就像‘乐高积木’：可数名词是独立散装积木，加一个就多一块 (-s/-es)；不可数名词是‘面粉和水’，流体抓不住，必须装进特定的碗或杯子里（数词+计量词+of）才能称重计量。"}, "stage_2_radar": {"name": "关卡 2 · 避坑雷达与口诀", "formula": "规则变化四步法：一般加 -s；特殊辅音结尾加 -es；辅音+y 变 ies；f/fe 结尾常变 ves (half -> halves, knife -> knives, leaf -> leaves)。 · 不规则变化核心群：变元音 (man->men, foot->feet, tooth->teeth)；加 -en (child->children)；单复同形 (sheep, deer, Chinese, fish)。", "pitfall": "【高频陷阱】：photo->photos, piano->pianos（外来词均加 -s）；German 变复数为 Germans（非 Germen）；stomach 结尾发 /k/ 音，复数直接加 -s (stomachs)。", "citation": {"source": "外研版七上 Starter 课本真实对白", "text": "Mum: Where is your schoolbag? Li Ming: There are two books, three pencils and an eraser in it."}}, "stage_3_challenge": {"name": "关卡 3 · 登顶闯关实战", "question": "There are forty ______ in our school, and three of them are from Germany. They are all friendly ______.", "options": ["A. woman teachers; Germans", "B. women teachers; Germans", "C. women teachers; Germen", "D. woman teachers; Germen"], "answer_index": 1, "painless_hint": "💡 提示：先抓句子主干成分，注意时间状语与主谓一致，排除倒装与时态干扰项。", "explanation": "woman 构成的职业复合名词，前后两词均需变复数：women teachers；German（德国人）变复数直接加 -s (Germans)，不可与 English/French 混淆。故选 B。"}}, {"card_id": "card_chap_01_p02", "topic_id": "chap_01_p02", "type": "grammar_checkpoint", "title": "不可数名词的计量与常见易错不可数名词", "category": "第1章 名词 (Noun)", "page_ref": "手绘语法教材 P4-P5 · 对应外研七上 Unit 2", "level": "中考必考 · 无痛通关", "stage_1_metaphor": {"name": "关卡 1 · 心智隐喻破壁", "content": "名词就像‘乐高积木’：可数名词是独立散装积木，加一个就多一块 (-s/-es)；不可数名词是‘面粉和水’，流体抓不住，必须装进特定的碗或杯子里（数词+计量词+of）才能称重计量。"}, "stage_2_radar": {"name": "关卡 2 · 避坑雷达与口诀", "formula": "六大中考必考抽象不可数名词：information (信息), advice (建议), news (新闻), progress (进步), fun (乐趣), homework (家庭作业)。 · 物质类不可数名词：water, bread, milk, beef, pork, rice, paper, money。", "pitfall": "【高频陷阱】：news 词尾有 -s 但为不可数名词，谓语动词用 is；practice 与 exercise 作锻炼时不可数，作具体练习题时可数。", "citation": {"source": "外研七上精读课文原句", "text": "Emma asked the librarian for some advice on starting a writing club in the reading room."}}, "stage_3_challenge": {"name": "关卡 3 · 登顶闯关实战", "question": "—Could you give me ______ on how to improve my spoken English?\n—Sure, listening to English songs is a good choice.", "options": ["A. an advice", "B. some advices", "C. a piece of advice", "D. many advices"], "answer_index": 2, "painless_hint": "💡 提示：先抓句子主干成分，注意时间状语与主谓一致，排除倒装与时态干扰项。", "explanation": "advice 为不可数名词，没有复数形式，不能加不定冠词 an。表达一条建议用 a piece of advice。故选 C。"}}, {"card_id": "card_chap_01_p03", "topic_id": "chap_01_p03", "type": "grammar_checkpoint", "title": "名词所有格 ('s 与 of 格及双重所有格)", "category": "第1章 名词 (Noun)", "page_ref": "手绘语法教材 P6-P9 · 对应外研七上 Family ties", "level": "中考必考 · 无痛通关", "stage_1_metaphor": {"name": "关卡 1 · 心智隐喻破壁", "content": "名词就像‘乐高积木’：可数名词是独立散装积木，加一个就多一块 (-s/-es)；不可数名词是‘面粉和水’，流体抓不住，必须装进特定的碗或杯子里（数词+计量词+of）才能称重计量。"}, "stage_2_radar": {"name": "关卡 2 · 避坑雷达与口诀", "formula": "'s 所有格：有生命的人或动物通常用 's；时间、距离、国家机构亦可用 (today's news, ten minutes' walk)。 · of 所有格：无生命事物多用 of (the door of the classroom, the capital of China)。", "pitfall": "【易混考点】：Lucy and Lily's bedroom（两人共住一间，bedroom 用单数）；Lucy's and Lily's bedrooms（各自有一间，bedrooms 用复数）。", "citation": {"source": "外研七上 Family ties 课文原句", "text": "A picture of a loving family moment brings back sweet memories of my childhood."}}, "stage_3_challenge": {"name": "关卡 3 · 登顶闯关实战", "question": "This is ______ bedroom. They have lived in the same room since they were born.", "options": ["A. Lucy's and Lily's", "B. Lucy and Lily's", "C. Lucy's and Lily", "D. Lucy and Lily"], "answer_index": 1, "painless_hint": "💡 提示：先抓句子主干成分，注意时间状语与主谓一致，排除倒装与时态干扰项。", "explanation": "后句说明两人同住一个房间，表示两人共同拥有，只需在最后一个名字后加 's。故选 B。"}}, {"card_id": "card_chap_02_p01", "topic_id": "chap_02_p01", "type": "grammar_checkpoint", "title": "不定冠词 a / an 的读音判别与泛指用法", "category": "第2章 冠词 (Article)", "page_ref": "手绘语法教材 P10-P11 · 对应外研七上 Starter", "level": "中考必考 · 无痛通关", "stage_1_metaphor": {"name": "关卡 1 · 心智隐喻破壁", "content": "冠词就像名词的‘通行证标签’：a/an 是临时临时访客证（泛指某一个），the 是实名制专属 VIP 门票（你我皆知的那个特指目标）。"}, "stage_2_radar": {"name": "关卡 2 · 避坑雷达与口诀", "formula": "用 a 的场景：单词开头以“辅音音素”发音 (a book, a European country, a university, a useful book)。 · 用 an 的场景：单词开头以“元音音素”发音 (an apple, an hour, an honest boy, an 8-year-old girl, an MP3 player)。", "pitfall": "【经典陷阱】：university, useful, European 虽然以元音字母 u/e 开头，但其国际音标为 /juː/（以辅音音素 /j/ 开头），前面用 a！hour, honest 首字母 h 不发音，音标以元音 /aʊ/、/ɒ/ 开头，前面用 an！", "citation": {"source": "外研七上日常对白原句", "text": "Tina's mother is an actress at an amusement park. She often dresses up as a fairy queen."}}, "stage_3_challenge": {"name": "关卡 3 · 登顶闯关实战", "question": "It took me ______ hour to finish the task, but it gave me ______ useful lesson.", "options": ["A. a; an", "B. an; a", "C. an; an", "D. a; a"], "answer_index": 1, "painless_hint": "💡 提示：先抓句子主干成分，注意时间状语与主谓一致，排除倒装与时态干扰项。", "explanation": "hour 中的 h 不发音，以元音音素 /aʊ/ 开头，用 an；useful 以辅音音素 /j/ 开头，用 a。故选 B。"}}, {"card_id": "card_chap_02_p02", "topic_id": "chap_02_p02", "type": "grammar_checkpoint", "title": "定冠词 the 的特指与零冠词固定搭配", "category": "第2章 冠词 (Article)", "page_ref": "手绘语法教材 P11-P13 · 对应外研七上 Unit 2", "level": "中考必考 · 无痛通关", "stage_1_metaphor": {"name": "关卡 1 · 心智隐喻破壁", "content": "冠词就像名词的‘通行证标签’：a/an 是临时临时访客证（泛指某一个），the 是实名制专属 VIP 门票（你我皆知的那个特指目标）。"}, "stage_2_radar": {"name": "关卡 2 · 避坑雷达与口诀", "formula": "the 的必考场景：特指双方已知事物；第二次提及的名词；世界上独一无二的事物 (the sun, the moon, the earth)；序数词与形容词最高级前；西洋/民族乐器前；姓氏复数表一家人 (the Browns)。 · 零冠词必考场景：三餐饭 (have breakfast)；球类与棋类 (play football, play chess)；学科与语言 (learn English)；季节月份星期 (in spring, on Monday)。", "pitfall": "【易混点】：play the piano (西洋乐器加 the) vs play football (球类不加 the)；by train (乘坐火车不用 the) vs on the train (在火车上用 the)。", "citation": {"source": "外研七上 Unit 2 课文原句", "text": "Rock music meets the erhu! The students enjoy playing the violin and playing basketball after school."}}, "stage_3_challenge": {"name": "关卡 3 · 登顶闯关实战", "question": "My brother loves music. He can play ______ piano very well, but he doesn't like playing ______ football.", "options": ["A. the; the", "B. /; the", "C. the; /", "D. /; /"], "answer_index": 2, "painless_hint": "💡 提示：先抓句子主干成分，注意时间状语与主谓一致，排除倒装与时态干扰项。", "explanation": "乐器名称前须加定冠词 the (play the piano)；球类运动名称前不用冠词 (play football)。故选 C。"}}, {"card_id": "card_chap_03_p01", "topic_id": "chap_03_p01", "type": "grammar_checkpoint", "title": "人称代词（主格/宾格）与物主代词（形容词性/名词性）", "category": "第3章 代词 (Pronoun)", "page_ref": "手绘语法教材 P14-P15 · 对应外研七上 Starter", "level": "中考必考 · 无痛通关", "stage_1_metaphor": {"name": "关卡 1 · 心智隐喻破壁", "content": "代词就像片场的‘替身演员’：主格只演主角（站在动词前发号施令），宾格演挨打的受众（站在动词或介词身后接招）。名词性物主代词是‘全职合体战士’(mine = my + pen)，身后绝不允许再跟小兵。"}, "stage_2_radar": {"name": "关卡 2 · 避坑雷达与口诀", "formula": "人称代词位置：主格在句首作主语 (I, you, he, she, it, we, they)；宾格在及物动词或介词后作宾语 (me, you, him, her, it, us, them)。 · 形容词性物主代词：相当于形容词，后面必须紧跟名词 (my pen, our school)。", "pitfall": "【易混点】：between you and me (介词 between 后必须用宾格 me，不能用 I)；it's (it is 缩写) 与 its (它的，物主代词) 的拼写混淆。", "citation": {"source": "外研七上 Starter 对白原句", "text": "This is my new classmate. I often help him with his English, and he helps me too."}}, "stage_3_challenge": {"name": "关卡 3 · 登顶闯关实战", "question": "—Is this Alice's schoolbag?\n—No, ______ is pink. This black one must be ______.", "options": ["A. her; your", "B. hers; yours", "C. hers; your", "D. her; yours"], "answer_index": 1, "painless_hint": "💡 提示：先抓句子主干成分，注意时间状语与主谓一致，排除倒装与时态干扰项。", "explanation": "第一空指代“她的书包”，且后无名词，用名词性物主代词 hers；第二空同样单独作表语指“你的书包”，用名词性物主代词 yours。故选 B。"}}, {"card_id": "card_chap_03_p02", "topic_id": "chap_03_p02", "type": "grammar_checkpoint", "title": "反身代词 (-self / -selves) 的用法与固定搭配", "category": "第3章 代词 (Pronoun)", "page_ref": "手绘语法教材 P16-P17 · 对应外研七上 Starter 单词表", "level": "中考必考 · 无痛通关", "stage_1_metaphor": {"name": "关卡 1 · 心智隐喻破壁", "content": "代词就像片场的‘替身演员’：主格只演主角（站在动词前发号施令），宾格演挨打的受众（站在动词或介词身后接招）。名词性物主代词是‘全职合体战士’(mine = my + pen)，身后绝不允许再跟小兵。"}, "stage_2_radar": {"name": "关卡 2 · 避坑雷达与口诀", "formula": "构成规则：第一、二人称在形容词性物主代词后加 self/selves (myself, ourselves)；第三人称在宾格后加 self/selves (himself, themselves)。 · 常见中考固定搭配：help oneself to (随便吃/用), enjoy oneself (玩得开心), teach oneself / learn by oneself (自学), hurt oneself (伤到自己), look after oneself (照顾自己), by oneself (独自)。", "pitfall": "【注意】：himself 和 themselves 不可错拼为 hisself 或 theirselves；单数 yourself 与复数 yourselves 需根据称呼对象单复数精准匹配。", "citation": {"source": "外研七上单词表原词引用", "text": "pron. (pl. yourselves) 你自己 / 你们自己 · Help yourselves to some fruit, children!"}}, "stage_3_challenge": {"name": "关卡 3 · 登顶闯关实战", "question": "Boys and girls, help ______ to some fresh strawberries on the table.", "options": ["A. yourself", "B. yourselves", "C. yourselves'", "D. them"], "answer_index": 1, "painless_hint": "💡 提示：先抓句子主干成分，注意时间状语与主谓一致，排除倒装与时态干扰项。", "explanation": "称呼语为 Boys and girls（复数概念），故反身代词应选用复数形式 yourselves。故选 B。"}}, {"card_id": "card_chap_05_p01", "topic_id": "chap_05_p01", "type": "grammar_checkpoint", "title": "时间介词 in / on / at 的精准层级划分与固定口诀", "category": "第5章 介词 (Preposition)", "page_ref": "手绘语法教材 P32-P33 · 对应外研七上 Starter", "level": "中考必考 · 无痛通关", "stage_1_metaphor": {"name": "关卡 1 · 心智隐喻破壁", "content": "介词就像空间与时间的‘GPS定位锚’：at 是精准瞄准的小红点（几点钟、小地点），on 是平铺的表面或具体某一天日历，in 是包容一切的大箱子或长岁月（年/月/季节）。"}, "stage_2_radar": {"name": "关卡 2 · 避坑雷达与口诀", "formula": "at (精确时间点/短暂瞬间)：at 7:30, at noon, at night, at midnight, at the moment, at the weekend。 · on (具体某一天或特定某天的上下午)：on Monday, on October 1st, on a rainy morning, on the evening of May 2nd, on Teachers' Day。", "pitfall": "【易混陷阱】：in the morning (泛指早晨) vs on a sunny morning (有形容词修饰的具体早晨用 on)；on Children's Day (具体节日当天用 on) vs at Christmas (节日期间用 at)。", "citation": {"source": "外研七上课文与作息表原句", "text": "Our class starts at 8:00 in the morning on weekdays, and on Friday afternoon we have PE."}}, "stage_3_challenge": {"name": "关卡 3 · 登顶闯关实战", "question": "Shenzhou-18 landed safely on Earth ______ the morning of November 4th, 2024.", "options": ["A. in", "B. on", "C. at", "D. by"], "answer_index": 1, "painless_hint": "💡 提示：先抓句子主干成分，注意时间状语与主谓一致，排除倒装与时态干扰项。", "explanation": "虽然有 the morning，但后面有 of November 4th 限定，属于具体某一天的早晨，必须用介词 on。故选 B。"}}, {"card_id": "card_chap_08_p01", "topic_id": "chap_08_p01", "type": "grammar_checkpoint", "title": "一般现在时与第三人称单数 (do/does)", "category": "第8章 动词时态与语态", "page_ref": "手绘语法教材 P82-P84 · 对应外研七上 Unit 1 & 启帆课笔记", "level": "中考必考 · 无痛通关", "stage_1_metaphor": {"name": "关卡 1 · 心智隐喻破壁", "content": "时态就像‘时空穿梭机’：一般现在时是永恒规律与日常惯性；现在完成时是‘过去扔的石头在现在激起的涟漪’。瞬间动词像照相机快门（咔嚓一下就结束），不能按住快门长达三年！"}, "stage_2_radar": {"name": "关卡 2 · 避坑雷达与口诀", "formula": "使用语境：表示现在的状态、经常性习惯性动作、客观真理与科学事实。 · 三单动词变化：一般加 -s；以 s, x, ch, sh, o 结尾加 -es (passes, fixes, watches, washes, goes)；以辅音+y 结尾变 y 为 i 加 -es (studies, flies)；特殊变化 have -> has。", "pitfall": "【致命陷阱】：客观真理即使在过去的宾语从句中也绝不倒退时态 (Our teacher said that the earth goes around the sun)；助动词 does/doesn't 出现后，实义动词必须打回原形！", "citation": {"source": "启帆课学习笔记原题", "text": "Tina's mother works at an amusement park. She doesn't like her mother's dress when she picks her up."}}, "stage_3_challenge": {"name": "关卡 3 · 登顶闯关实战", "question": "The ancient Greek philosopher proved that the earth ______ around the sun.", "options": ["A. went", "B. goes", "C. is going", "D. will go"], "answer_index": 1, "painless_hint": "💡 提示：先抓句子主干成分，注意时间状语与主谓一致，排除倒装与时态干扰项。", "explanation": "“地球绕着太阳转”属于永恒的客观科学真理，在宾语从句中不受主句过去时态影响，必须使用一般现在时。故选 B。"}}, {"card_id": "card_chap_08_p04", "topic_id": "chap_08_p04", "type": "grammar_checkpoint", "title": "现在完成时 (have/has + done) 与延续性动词转换", "category": "第8章 动词时态与语态", "page_ref": "手绘语法教材 P88-P91 · 中考高频核心考点", "level": "中考必考 · 无痛通关", "stage_1_metaphor": {"name": "关卡 1 · 心智隐喻破壁", "content": "时态就像‘时空穿梭机’：一般现在时是永恒规律与日常惯性；现在完成时是‘过去扔的石头在现在激起的涟漪’。瞬间动词像照相机快门（咔嚓一下就结束），不能按住快门长达三年！"}, "stage_2_radar": {"name": "关卡 2 · 避坑雷达与口诀", "formula": "基本结构：have / has + 过去分词 (done)。 · 三大标志词群：1. already (肯定句), yet (否定/疑问句); 2. ever, never, just, recently; 3. for + 时间段, since + 时间点/过去时从句。", "pitfall": "【最高频错题】：不能说 *I have bought this book for three years*，买是一个瞬间动作，不能延续三年！必须改为 I have had this book for three years。", "citation": {"source": "中考完形填空经典原题引用", "text": "Mr. Green has lived in China for over ten years, so he has been to many famous cities."}}, "stage_3_challenge": {"name": "关卡 3 · 登顶闯关实战", "question": "His grandfather ______ for nearly five years, but he still misses him very much.", "options": ["A. died", "B. has died", "C. has been dead", "D. was dead"], "answer_index": 2, "painless_hint": "💡 提示：先抓句子主干成分，注意时间状语与主谓一致，排除倒装与时态干扰项。", "explanation": "句中有 for nearly five years（长达五年的一段时间），谓语动词必须使用延续性状态。die 是瞬间动词不可连用，需转为 be dead 状态。故选 C。"}}, {"card_id": "card_chap_10_p01", "topic_id": "chap_10_p01", "type": "grammar_checkpoint", "title": "宾语从句三要素 (连接词/陈述语序/主从时态呼应)", "category": "第10章 复合句体系", "page_ref": "手绘语法教材 P112-P115 · 中考单选与完形必考", "level": "中考必考 · 无痛通关", "stage_1_metaphor": {"name": "关卡 1 · 心智隐喻破壁", "content": "从句就像‘被收纳进大衣柜的折叠衣物’：在外面当独立问句时可以随手倒装甩开，一旦被请进主句当宾语，必须叠得整整齐齐（主语在前，动词在后，陈述语序）。"}, "stage_2_radar": {"name": "关卡 2 · 避坑雷达与口诀", "formula": "要素一·连接词：陈述句充当宾从用 that (可省)；一般疑问句用 if / whether (是否)；特殊疑问句用原有疑问词 (who, where, when, why, how)。 · 要素二·语序铁律：从句必须是“连接词 + 主语 + 谓语 + 其他”的陈述语序，绝不能用 does/did/is 倒装！", "pitfall": "【经典陷阱】：Could you tell me... 虽以 Could 开头，但属于表示委婉客气的现在语气，主句不是过去时，不可机械把从句误变成过去时！", "citation": {"source": "外研七上与中考真题典型句子", "text": "Could you please tell me where the library is? Emma wants to know if they can start a reading club."}}, "stage_3_challenge": {"name": "关卡 3 · 登顶闯关实战", "question": "Excuse me, could you tell me ______?", "options": ["A. where does the bus stop", "B. where the bus stops", "C. when will the train arrive", "D. what is your sister doing"], "answer_index": 1, "painless_hint": "💡 提示：先抓句子主干成分，注意时间状语与主谓一致，排除倒装与时态干扰项。", "explanation": "宾语从句必须使用陈述语序（主语在前，谓语在后）。A项 does 提前倒装错误；C项 will 提前错误；D项 is 提前错误。只有 B 项 where the bus stops 为标准陈述语序。故选 B。"}}, {"card_id": "card_chap_04_p01", "topic_id": "chap_04_p01", "type": "grammar_checkpoint", "title": "基数词的构成规律与大数时刻表达", "category": "第4章 数词 (Numeral)", "page_ref": "手绘语法教材 P24-P27 · 对应外研七上 Starter", "level": "中考必考 · 无痛通关", "stage_1_metaphor": {"name": "关卡 1 · 心智隐喻破壁", "content": "数词就像‘尺子与标尺’：基数词是数豆子算个数，序数词是排队抢位次。大数词 hundred/thousand 像大箱子，前面有数字就是固定规格不加 s，成千上万没数字才散架加 s (thousands of)。"}, "stage_2_radar": {"name": "关卡 2 · 避坑雷达与口诀", "formula": "时间顺读法：点钟 + 分钟 (7:20 -> seven twenty)。 · 时间逆读法：分钟 <= 30 用 past (7:20 -> twenty past seven; 7:30 -> half past seven)；分钟 > 30 用 to (7:40 -> twenty to eight)。一刻钟用 a quarter (7:15 -> a quarter past seven)。", "pitfall": "【必考混淆点】：two hundred (确数，不能加 s) vs hundreds of (概数，必须加 s 和 of)；基数词连字符复合形容词单数名词 (an 8-year-old girl，中考单选必考，year 不能加 s)。", "citation": {"source": "外研七上 Starter 真实对白", "text": "Li Ming: What time is it now? Mum: It is twenty past seven. We have twenty-five minutes before the school bus arrives."}}, "stage_3_challenge": {"name": "关卡 3 · 登顶闯关实战", "question": "Every year, ______ tourists from all over the world come to visit the Great Wall.", "options": ["A. thousand of", "B. thousands of", "C. five thousands", "D. five thousand of"], "answer_index": 1, "painless_hint": "💡 提示：先抓句子主干成分，注意时间状语与主谓一致，排除倒装与时态干扰项。", "explanation": "表示成千上万的概数概念，数词单位需加 -s 并与 of 连用：thousands of；若有具体数字 five，则需用 five thousand。故选 B。"}}, {"card_id": "card_chap_04_p02", "topic_id": "chap_04_p02", "type": "grammar_checkpoint", "title": "序数词的构成口诀与特殊用法", "category": "第4章 数词 (Numeral)", "page_ref": "手绘语法教材 P28-P31 · 对应外研七上短语专项", "level": "中考必考 · 无痛通关", "stage_1_metaphor": {"name": "关卡 1 · 心智隐喻破壁", "content": "数词就像‘尺子与标尺’：基数词是数豆子算个数，序数词是排队抢位次。大数词 hundred/thousand 像大箱子，前面有数字就是固定规格不加 s，成千上万没数字才散架加 s (thousands of)。"}, "stage_2_radar": {"name": "关卡 2 · 避坑雷达与口诀", "formula": "构成规则：牢记“基变序”口诀，尤其注意 ninth (去e), eighth (去t), fifth/twelfth (ve变f), fortieth (y变ie)。 · 定冠词 the + 序数词：表示特定的次序 (the second time, the third question)。", "pitfall": "【易混点】：ninth 千万不要写成 *nineth*；fortieth 千万不要写成 *fourtieth*；a second time（再来一次，不表特定排位）。", "citation": {"source": "外研七上词汇资料原句", "text": "The science laboratory is on the second floor of Building A. Today is October the first."}}, "stage_3_challenge": {"name": "关卡 3 · 登顶闯关实战", "question": "December is the ______ month of a year, and Christmas is on the ______ of this month.", "options": ["A. twelve; twenty-five", "B. twelfth; twenty-fifth", "C. twelveth; twenty-fifth", "D. twelfth; twenty-five"], "answer_index": 1, "painless_hint": "💡 提示：先抓句子主干成分，注意时间状语与主谓一致，排除倒装与时态干扰项。", "explanation": "第十二个月为 twelfth (ve变f加th，不带e)；第二十五天为 twenty-fifth (只变个位)。故选 B。"}}, {"card_id": "card_chap_06_p01", "topic_id": "chap_06_p01", "type": "grammar_checkpoint", "title": "情态动词 can / must / may / should 基本用法与推测语气", "category": "第6章 动词：情态与非谓语", "page_ref": "手绘语法教材 P58-P63 · 对应中考单选必考", "level": "中考必考 · 无痛通关", "stage_1_metaphor": {"name": "关卡 1 · 心智隐喻破壁", "content": "非谓语动词就像‘分身术’：一个句子只能有一个真正的谓语心脏。想要表达多个动作，其他动词必须戴面具——to do 代表将要去做的目标，doing 代表正在享受或正在发生的过程。"}, "stage_2_radar": {"name": "关卡 2 · 避坑雷达与口诀", "formula": "情态动词后必须紧跟动词原形，没有人称和数的变化 (He must do it)。 · 否定回答特殊点：—Must I finish it now? —No, you needn't. / No, you don't have to. (不必，绝不能用 mustn't 回答！)", "pitfall": "【中考最高频陷阱】：—Must I hand in my homework today? —No, you needn't.（否定回答只能用 needn't，用 mustn't 直接判错）。", "citation": {"source": "外研七上交际情景原句", "text": "Students must keep quiet in the reading room. You can borrow three books at a time, but you mustn't take them away without asking."}}, "stage_3_challenge": {"name": "关卡 3 · 登顶闯关实战", "question": "—Must we clean the classroom right now?\n—No, you ______. You can do it after the last class.", "options": ["A. mustn't", "B. can't", "C. needn't", "D. shouldn't"], "answer_index": 2, "painless_hint": "💡 提示：先抓句子主干成分，注意时间状语与主谓一致，排除倒装与时态干扰项。", "explanation": "以 Must 提问的一般疑问句，否定回答表示“不必”，必须用 No, you needn't 或 you don't have to。mustn't 意为“禁止”，不符合语境。故选 C。"}}, {"card_id": "card_chap_06_p03", "topic_id": "chap_06_p03", "type": "grammar_checkpoint", "title": "非谓语动词：动词不定式 to do 与动名词 doing", "category": "第6章 动词：情态与非谓语", "page_ref": "手绘语法教材 P66-P71 · 对应中考语法填空必考", "level": "中考必考 · 无痛通关", "stage_1_metaphor": {"name": "关卡 1 · 心智隐喻破壁", "content": "非谓语动词就像‘分身术’：一个句子只能有一个真正的谓语心脏。想要表达多个动作，其他动词必须戴面具——to do 代表将要去做的目标，doing 代表正在享受或正在发生的过程。"}, "stage_2_radar": {"name": "关卡 2 · 避坑雷达与口诀", "formula": "只接 doing 的常见动词：enjoy, finish, practice, mind, consider, keep, suggest, feel like, look forward to (to 为介词)。 · 只接 to do 的常见动词：want, hope, wish, decide, refuse, agree, promise, expect, choose, plan。", "pitfall": "【易混陷阱】：look forward to hearing from you (to 是介词，必须接 hearing，不能接 hear)；forget to close the door (门还没关) vs forget closing the door (关过门但忘了)。", "citation": {"source": "外研七上课文原句", "text": "Emma decided to start a writing club because she enjoys sharing fantasy stories with others."}}, "stage_3_challenge": {"name": "关卡 3 · 登顶闯关实战", "question": "I am really looking forward to ______ my pen pal from Australia this summer holiday.", "options": ["A. visit", "B. visiting", "C. visited", "D. to visit"], "answer_index": 1, "painless_hint": "💡 提示：先抓句子主干成分，注意时间状语与主谓一致，排除倒装与时态干扰项。", "explanation": "look forward to 中 to 是介词，介词后面必须接动名词 doing (visiting)。故选 B。"}}, {"card_id": "card_chap_07_p01", "topic_id": "chap_07_p01", "type": "grammar_checkpoint", "title": "形容词与副词的比较级、最高级及核心句型", "category": "第7章 形容词与副词", "page_ref": "手绘语法教材 P72-P79 · 对应中考高频考点", "level": "中考必考 · 无痛通关", "stage_1_metaphor": {"name": "关卡 1 · 心智隐喻破壁", "content": "比较级就像‘两台天平’：A 和 B 称重找差额 (than)；最高级是‘冠军领奖台’(the -est of all)。想要修饰比较级，只能请出 much/even 这样的重磅砝码，千万别用 very！"}, "stage_2_radar": {"name": "关卡 2 · 避坑雷达与口诀", "formula": "两者比较用比较级：A + be + 比较级 + than + B；修饰比较级的程度副词：much, a lot, even, far, a little (绝对不能用 very 修饰比较级)。 · 三者及以上用最高级：the + 最高级 + of/in 范围；one of the + 最高级 + 复数名词 (one of the tallest buildings)。", "pitfall": "【经典陷阱】：the more..., the more... 结构后必须用比较级；much 才能修饰比较级 (much better)，绝不能说 *very better*！", "citation": {"source": "中考真题与课文精选原句", "text": "The more books you read, the wiser you will become. English is one of the most widely used languages in the world."}}, "stage_3_challenge": {"name": "关卡 3 · 登顶闯关实战", "question": "With the development of technology, electric cars are becoming ______ than before.", "options": ["A. popular", "B. more popular", "C. most popular", "D. the most popular"], "answer_index": 1, "painless_hint": "💡 提示：先抓句子主干成分，注意时间状语与主谓一致，排除倒装与时态干扰项。", "explanation": "句中有两者对比标志词 than，且 popular 是多音节词，其比较级前需加 more。故选 B。"}}, {"card_id": "card_chap_09_p01", "topic_id": "chap_09_p01", "type": "grammar_checkpoint", "title": "主谓一致三大原则与 There be 句型就近原则", "category": "第9章 简单句与主谓一致", "page_ref": "手绘语法教材 P100-P107 · 对应中考必考", "level": "中考必考 · 无痛通关", "stage_1_metaphor": {"name": "关卡 1 · 心智隐喻破壁", "content": "主谓一致就像‘天平校准’：左边放什么重量的主语，右边就要摆对应尺寸的谓语动词。遇到 There be 和 either...or，动词很现实，只看离自己最近的‘邻居’是谁！"}, "stage_2_radar": {"name": "关卡 2 · 避坑雷达与口诀", "formula": "就近原则：There be, either A or B, neither A nor B, not only A but also B，谓语动词形式取决于靠近动词的那个名词/代词。 · 就远原则：主语 + with / together with / along with / as well as / including，谓语动词由最前面的主语决定 (The teacher, with her students, is reading books)。", "pitfall": "【易错考点】：The teacher with two students ______ (is/are)? with 结构属于就远原则，第一主语 The teacher 是单数，必须用 is！", "citation": {"source": "外研七上课文与笔记原题", "text": "There is a pencil case and three notebooks on the desk. Neither Tom nor his parents like watching TV."}}, "stage_3_challenge": {"name": "关卡 3 · 登顶闯关实战", "question": "There ______ a ruler and two erasers in the pencil case.", "options": ["A. is", "B. are", "C. be", "D. were"], "answer_index": 0, "painless_hint": "💡 提示：先抓句子主干成分，注意时间状语与主谓一致，排除倒装与时态干扰项。", "explanation": "There be 句型遵从“就近原则”，紧邻 be 动词的名词是单数 a ruler，因此 be 动词选用单数形式 is。故选 A。"}}, {"card_id": "card_chap_10_p02", "topic_id": "chap_10_p02", "type": "grammar_checkpoint", "title": "状语从句体系与“主将从现”核心铁律", "category": "第10章 复合句体系", "page_ref": "手绘语法教材 P116-P121 · 对应中考必考考点", "level": "中考必考 · 无痛通关", "stage_1_metaphor": {"name": "关卡 1 · 心智隐喻破壁", "content": "从句就像‘被收纳进大衣柜的折叠衣物’：在外面当独立问句时可以随手倒装甩开，一旦被请进主句当宾语，必须叠得整整齐齐（主语在前，动词在后，陈述语序）。"}, "stage_2_radar": {"name": "关卡 2 · 避坑雷达与口诀", "formula": "主将从现原则：主句用一般将来时 / 祈使句 / 情态动词，时间或条件状语从句中用一般现在时表将来。 · 连词辨析：unless = if not (除非，如果不)；as soon as (一……就……)；not...until (直到……才)；although / though (尽管，绝不能与 but 连用)；so...that (如此……以至于)。", "pitfall": "【经典陷阱】：Although he was ill, ______ he still went to work.（错选 but！although 与 but 绝不能出现在同一个复合句中）。", "citation": {"source": "中考真题阅读与课文经典原句", "text": "If it doesn't rain tomorrow, we will go for an autumn picnic in the forest park."}}, "stage_3_challenge": {"name": "关卡 3 · 登顶闯关实战", "question": "We will have a sports meeting next Friday if it ______ fine.", "options": ["A. will be", "B. is", "C. was", "D. are"], "answer_index": 1, "painless_hint": "💡 提示：先抓句子主干成分，注意时间状语与主谓一致，排除倒装与时态干扰项。", "explanation": "if 引导条件状语从句，符合“主将从现”原则，主句是一般将来时 will have，从句主语 it 是单数，必须使用一般现在时 is。故选 B。"}}, {"card_id": "card_chap_10_p03", "topic_id": "chap_10_p03", "type": "grammar_checkpoint", "title": "定语从句入门：先行词定位与关系代词选用", "category": "第10章 复合句体系", "page_ref": "手绘语法教材 P122-P127 · 对应中考压轴阅读与完形", "level": "中考必考 · 无痛通关", "stage_1_metaphor": {"name": "关卡 1 · 心智隐喻破壁", "content": "从句就像‘被收纳进大衣柜的折叠衣物’：在外面当独立问句时可以随手倒装甩开，一旦被请进主句当宾语，必须叠得整整齐齐（主语在前，动词在后，陈述语序）。"}, "stage_2_radar": {"name": "关卡 2 · 避坑雷达与口诀", "formula": "先行词定位：被定语从句修饰的名词或代词叫先行词，通常紧贴定语从句前。 · 关系代词双重身份：既起连接主从句作用，又在从句中充当主语、宾语或定语。", "pitfall": "【易混点】：The book ______ I bought yesterday is interesting. 先行词是书（物），在从句中作宾语，可填 which/that 或省略；但先行词被 the first 修饰时只能用 that。", "citation": {"source": "课文与经典长难句引用", "text": "The scientist who won the Nobel Prize spent over thirty years conducting experiments in his laboratory."}}, "stage_3_challenge": {"name": "关卡 3 · 登顶闯关实战", "question": "This is the most touching movie ______ I have ever watched in my life.", "options": ["A. which", "B. that", "C. who", "D. what"], "answer_index": 1, "painless_hint": "💡 提示：先抓句子主干成分，注意时间状语与主谓一致，排除倒装与时态干扰项。", "explanation": "先行词 movie 被形容词最高级 the     let currentCategory = 'all';
    let currentMode = 'flip';
    let answeredStats = { total: 0, correct: 0 };

    // Build Categories
    const categories = ['all', '名词', '冠词', '代词', '数词', '介词', '非谓语', '形容词', '时态', '简单句', '复合句', '教材精读'];

    function renderPills() {
      const container = document.getElementById('category-pills');
      container.innerHTML = categories.map(cat => {
        const label = cat === 'all' ? '全部卡片 (76)' : cat;
        return `<button class="pill-btn ${cat === currentCategory ? 'active' : ''}" onclick="setCategory('${cat}')">${label}</button>`;
      }).join('');
    }

    function setCategory(cat) {
      currentCategory = cat;
      renderPills();
      filterCards();
    }

    function filterCards() {
      const q = document.getElementById('card-search').value.toLowerCase().trim();
      
      const filtered = allCards.filter(c => {
        const matchCat = currentCategory === 'all' || c.category.includes(currentCategory) || (currentCategory === '教材精读' && c.type === 'textbook_checkpoint');
        const matchQ = !q || c.title.toLowerCase().includes(q) || c.category.toLowerCase().includes(q) || c.stage_1_metaphor.content.toLowerCase().includes(q) || c.stage_2_radar.formula.toLowerCase().includes(q);
        return matchCat && matchQ;
      });

      document.getElementById('showing-count').innerText = filtered.length;

      if (currentMode === 'flip') {
        renderFlipView(filtered);
      } else {
        renderChallengeView(filtered);
      }
    }

    function renderFlipView(cards) {
      const container = document.getElementById('view-flip');
      container.innerHTML = cards.map((c, idx) => `
        <div class="card-scene">
          <div class="flip-card" id="flip-card-${idx}">
            <!-- FRONT FACE -->
            <div class="card-face">
              <div class="card-badge-line">
                <span class="card-category">${c.category}</span>
                <span class="card-source">${c.page_ref}</span>
              </div>
              <div class="card-title">${c.title}</div>
              
              <div class="stage-box">
                <span class="stage-label label-metaphor">🌊 关卡 1 · 心智生活隐喻</span>
                <div class="stage-content">${c.stage_1_metaphor.content}</div>
              </div>

              <div class="stage-box" style="margin-top:auto;">
                <span class="stage-label label-challenge">🏆 关卡 3 · 登顶目标</span>
                <div style="font-size:0.84rem; color:#cbd5e1; font-weight:500;">
                  ${c.stage_3_challenge.question.replace(/\n/g, '<br>')}
                </div>
              </div>

              <button class="card-flip-btn" onclick="toggleFlip(${idx})">
                <span>🔄 翻转查看避坑雷达与口诀</span>
              </button>
            </div>

            <!-- BACK FACE -->
            <div class="card-face card-face-back">
              <div class="card-badge-line">
                <span class="card-category" style="color:#fbbf24; border-color:#fbbf24;">⚡ 避坑雷达与真题</span>
                <span class="card-source">${c.level}</span>
              </div>
              
              <div class="formula-text">
                <strong>📌 速记公式：</strong><br>${c.stage_2_radar.formula}
              </div>

              <div class="pitfall-text">
                ${c.stage_2_radar.pitfall}
              </div>

              ${c.stage_2_radar.citation ? `
                <div class="citation-quote">
                  📖 <b>${c.stage_2_radar.citation.source}：</b>“${c.stage_2_radar.citation.text}”
                </div>
              ` : ''}

              <div style="margin-top:auto; font-size:0.8rem; color:#34d399; background:rgba(16,185,129,0.1); padding:0.5rem; border-radius:0.4rem;">
                🎯 <b>通关密钥：</b>${c.stage_3_challenge.options[c.stage_3_challenge.answer_index]}
              </div>

              <button class="card-flip-btn" onclick="toggleFlip(${idx})" style="margin-top:0.5rem;">
                <span>🔄 翻回正面隐喻</span>
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function renderChallengeView(cards) {
      const container = document.getElementById('view-challenge');
      container.innerHTML = cards.map((c, idx) => `
        <div class="challenge-card" id="chal-${idx}">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span class="card-category">${c.category} · ${c.level}</span>
            <span style="font-size:0.8rem; color:var(--muted);">${c.page_ref}</span>
          </div>

          <div style="font-size:1.1rem; font-weight:700; color:#fff;">
            【${c.title}】${c.stage_3_challenge.question.replace(/\n/g, '<br>')}
          </div>

          <div class="hint-trigger" onclick="toggleHint(${idx})">
            <span>💡 觉得难？点击获取无痛启发提示 (不直接给答案)</span>
          </div>
          <div class="hint-box" id="hint-box-${idx}">
            ${c.stage_3_challenge.painless_hint}
          </div>

          <div class="options-grid">
            ${c.stage_3_challenge.options.map((opt, oIdx) => `
              <button class="quiz-opt-btn" id="qbtn-${idx}-${oIdx}" onclick="answerQuiz(${idx}, ${oIdx})">
                <span>${opt}</span>
                <span id="badge-${idx}-${oIdx}"></span>
              </button>
            `).join('')}
          </div>

          <div class="expl-box" id="expl-box-${idx}">
            <strong style="color:#34d399;">🏆 闯关解析与通关要义：</strong><br>
            ${c.stage_3_challenge.explanation}
          </div>
        </div>
      `).join('');
    }

    function toggleFlip(idx) {
      const el = document.getElementById(`flip-card-${idx}`);
      el.classList.toggle('is-flipped');
    }

    function toggleHint(idx) {
      const h = document.getElementById(`hint-box-${idx}`);
      h.style.display = h.style.display === 'block' ? 'none' : 'block';
    }

    function answerQuiz(qIdx, selectedIdx) {
      const filtered = getCurrentFiltered();
      const c = filtered[qIdx];
      const correctIdx = c.stage_3_challenge.answer_index;

      c.stage_3_challenge.options.forEach((_, oIdx) => {
        const btn = document.getElementById(`qbtn-${qIdx}-${oIdx}`);
        btn.disabled = true;
        if (oIdx === correctIdx) {
          btn.classList.add('correct');
          document.getElementById(`badge-${qIdx}-${oIdx}`).innerText = '✓ 通关正确';
        } else if (oIdx === selectedIdx) {
          btn.classList.add('wrong');
          document.getElementById(`badge-${qIdx}-${oIdx}`).innerText = '✗ 掉入陷阱';
        }
      });

      document.getElementById(`expl-box-${qIdx}`).style.display = 'block';

      answeredStats.total += 1;
      if (selectedIdx === correctIdx) answeredStats.correct += 1;
      updateStats();
    }

    function updateStats() {
      document.getElementById('answered-count').innerText = answeredStats.total;
      const rate = answeredStats.total > 0 ? Math.round((answeredStats.correct / answeredStats.total) * 100) : 100;
      document.getElementById('accuracy-rate').innerText = `${rate}%`;
    }

    function getCurrentFiltered() {
      const q = document.getElementById('card-search').value.toLowerCase().trim();
      return allCards.filter(c => {
        const matchCat = currentCategory === 'all' || c.category.includes(currentCategory) || (currentCategory === '教材精读' && c.type === 'textbook_checkpoint');
        const matchQ = !q || c.title.toLowerCase().includes(q) || c.category.toLowerCase().includes(q) || c.stage_1_metaphor.content.toLowerCase().includes(q);
        return matchCat && matchQ;
      });
    }

    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('btn-mode-flip').classList.toggle('active', mode === 'flip');
      document.getElementById('btn-mode-challenge').classList.toggle('active', mode === 'challenge');
      
      document.getElementById('view-flip').style.display = mode === 'flip' ? 'grid' : 'none';
      document.getElementById('view-challenge').style.display = mode === 'challenge' ? 'flex' : 'none';
      filterCards();
    }

    function openExportModal(type) {

      if (type === 'anki') {

        snippet.innerText = '# Anki TSV 牌组节选 (共76张无痛卡片)：\n【名词体系】可数名词及其单复数变化规则\t💡 关卡1 心智隐喻：名词就像乐高积木...\t第1章 名词\n【时态体系】现在完成时与延续性动词\t💡 关卡1 心智隐喻：瞬间动词像相机快门...\t第8章 时态语态';
      } else {
